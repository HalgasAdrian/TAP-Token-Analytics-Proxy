services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    # Dev orchestration: the source is mounted and uvicorn reloads on change.
    # The Dockerfile's baked-in COPY + plain uvicorn is the production artifact.
    volumes:
      - ./backend/app:/app/app
      # Dev-only tooling (seed script); not baked into the production image.
      - ./backend/dev:/app/dev
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tap}
      POSTGRES_DB: ${POSTGRES_DB:-tap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fake OpenAI-compatible provider for local demos and tests — no API key, no
  # provider spend. Opt in with `docker compose --profile dev up` and set
  # UPSTREAM_BASE_URL=http://mock-upstream:9000 in .env.
  mock-upstream:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./backend/dev:/app/dev
    command:
      - uvicorn
      - dev.mock_upstream:app
      - --host
      - 0.0.0.0
      - --port
      - "9000"

volumes:
  postgres_data:
