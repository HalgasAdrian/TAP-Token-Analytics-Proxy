services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # The dev stage carries pytest and ruff, so `docker compose exec api
      # pytest` works. The default (runtime) stage is the deploy artifact.
      target: dev
    ports:
      - "8000:8000"
    env_file: .env
    # Source is mounted and uvicorn reloads on change.
    volumes:
      - ./backend/app:/app/app
      - ./backend/dev:/app/dev
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
    # Migrations run before the app starts. In production this is Fly's
    # release_command, which runs once per deploy rather than per instance.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tap}
      POSTGRES_DB: ${POSTGRES_DB:-tap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fake OpenAI-compatible provider for local demos and tests — no API key, no
  # provider spend. Opt in with `docker compose --profile dev up` and set
  # UPSTREAM_BASE_URL=http://mock-upstream:9000 in .env.
  mock-upstream:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./backend/dev:/app/dev
    command:
      - uvicorn
      - dev.mock_upstream:app
      - --host
      - 0.0.0.0
      - --port
      - "9000"

volumes:
  postgres_data:
